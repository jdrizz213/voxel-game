<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shards of the Voxel Seed</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Title screen -->
    <div id="title-screen">
        <div id="title-logo">Shards of the Voxel Seed</div>
        <button id="play-button">Play</button>
    </div>

    <!-- Loading screen -->
    <div id="loading">Loading Voxel World…</div>

    <!-- Inventory bar -->
    <div id="inventory">
        <div class="slot selected" data-block="grass">G</div>
        <div class="slot" data-block="sand">S</div>
        <div class="slot" data-block="snow">N</div>
        <div class="slot" data-block="stone">T</div>
        <div class="slot" data-block="crystal">C</div>
    </div>

    <!-- Crafting bar -->
    <div id="crafting">
        <button id="craft-crystal">Craft Crystal (3 Stone)</button>
        <span id="craft-info"></span>
    </div>

    <script type="module" src="main.js"></script>

    <script>
        window.onload = () => {
            document.getElementById("loading").style.display = "none";
        };

        const slots = document.querySelectorAll(".slot");
        slots.forEach(slot => {
            slot.addEventListener("click", () => {
                slots.forEach(s => s.classList.remove("selected"));
                slot.classList.add("selected");
            });
        });

        const titleScreen = document.getElementById("title-screen");
        const playButton = document.getElementById("play-button");
        playButton.addEventListener("click", () => {
            titleScreen.style.display = "none";
        });
    </script>

</body>
</html>
